      - {name: item_key, expr: sr_item_sk, description: Returned item key., synonyms: [returned item], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: customer_key, expr: sr_customer_sk, description: Returning customer key., synonyms: [return customer], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
