verified_queries:
  - name: q98_store_item_revenue_by_product_class
    question: Store sales item revenue for Sports, Books and Home during the 1999-02-22 thirty-day window by item description, category, class and current price.
    sql: |
      SELECT i_item_desc, i_category, i_class, i_current_price, sum(ss_ext_sales_price) AS itemrevenue, sum(ss_ext_sales_price) * 100 / sum(sum(ss_ext_sales_price)) OVER (PARTITION BY i_class) AS revenueratio
      FROM cz_sv_tpcds_sf1_1789702136159.store_sales, cz_sv_tpcds_sf1_1789702136159.item, cz_sv_tpcds_sf1_1789702136159.date_dim
      WHERE ss_item_sk = i_item_sk AND i_category IN ('Sports', 'Books', 'Home') AND ss_sold_date_sk = d_date_sk AND d_date BETWEEN cast('1999-02-22' AS DATE) AND (cast('1999-02-22' AS DATE) + INTERVAL 30 days)
      GROUP BY i_item_id, i_item_desc, i_category, i_class, i_current_price
      ORDER BY i_category, i_class, i_item_id, i_item_desc, revenueratio
  - name: q7_store_demographic_promotion_item_averages
    question: Store sales averages by item for male single college customers, email or event promotion exclusions, and year 2000.
    sql: |
      SELECT i_item_id, avg(ss_quantity) agg1, avg(ss_list_price) agg2, avg(ss_coupon_amt) agg3, avg(ss_sales_price) agg4
      FROM cz_sv_tpcds_sf1_1789702136159.store_sales, cz_sv_tpcds_sf1_1789702136159.customer_demographics, cz_sv_tpcds_sf1_1789702136159.date_dim, cz_sv_tpcds_sf1_1789702136159.item, cz_sv_tpcds_sf1_1789702136159.promotion
      WHERE ss_sold_date_sk = d_date_sk AND ss_item_sk = i_item_sk AND ss_cdemo_sk = cd_demo_sk AND ss_promo_sk = p_promo_sk AND cd_gender = 'M' AND cd_marital_status = 'S' AND cd_education_status = 'College' AND (p_channel_email = 'N' OR p_channel_event = 'N') AND d_year = 2000
      GROUP BY i_item_id
      ORDER BY i_item_id
      LIMIT 100
  - name: q21_inventory_before_after_item_warehouse
    question: Inventory before and after a target date by warehouse and item with current-price and date-window filters.
    sql: |
      SELECT * FROM (SELECT w_warehouse_name, i_item_id, sum(CASE WHEN (cast(d_date AS DATE) < cast('2000-03-11' AS DATE)) THEN inv_quantity_on_hand ELSE 0 END) AS inv_before, sum(CASE WHEN (cast(d_date AS DATE) >= cast('2000-03-11' AS DATE)) THEN inv_quantity_on_hand ELSE 0 END) AS inv_after FROM cz_sv_tpcds_sf1_1789702136159.inventory, cz_sv_tpcds_sf1_1789702136159.warehouse, cz_sv_tpcds_sf1_1789702136159.item, cz_sv_tpcds_sf1_1789702136159.date_dim WHERE i_current_price BETWEEN 0.99 AND 1.49 AND i_item_sk = inv_item_sk AND inv_warehouse_sk = w_warehouse_sk AND inv_date_sk = d_date_sk AND d_date BETWEEN (cast('2000-03-11' AS DATE) - INTERVAL 30 days) AND (cast('2000-03-11' AS DATE) + INTERVAL 30 days) GROUP BY w_warehouse_name, i_item_id) x
      WHERE (CASE WHEN inv_before > 0 THEN inv_after / inv_before ELSE NULL END) BETWEEN 2.0 / 3.0 AND 3.0 / 2.0
      ORDER BY w_warehouse_name, i_item_id
      LIMIT 100
