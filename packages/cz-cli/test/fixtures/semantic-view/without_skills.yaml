    filters: []
    constraints: []
  - name: web_returns
    description: Web channel return fact keyed by order and item.
    synonyms: [web returns]
    base_table: {workspace: czcli, schema: cz_sv_tpcds_sf1_1789702136159, table: web_returns}
    primary_key: {columns: [wr_order_number, wr_item_sk]}
    unique_keys: []
    dimensions:
      - {name: order_number, expr: wr_order_number, description: Returned web order number., synonyms: [web return order], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
