      - {name: store_return_quantity, expr: SUM(sr_return_quantity), description: Total store returned quantity., synonyms: [store returned units], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
    filters: []
    constraints: []
  - name: catalog_returns
    description: Catalog channel return fact keyed by order and item.
    synonyms: [catalog returns]
    base_table: {workspace: czcli, schema: cz_sv_tpcds_sf1_1789702136159, table: catalog_returns}
    primary_key: {columns: [cr_order_number, cr_item_sk]}
    unique_keys: []
    dimensions:
      - {name: order_number, expr: cr_order_number, description: Returned catalog order number., synonyms: [catalog return order], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: item_key, expr: cr_item_sk, description: Returned catalog item key., synonyms: [catalog returned item], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: returning_customer_key, expr: cr_returning_customer_sk, description: Returning catalog customer key., synonyms: [returning customer], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
    time_dimensions: []
    facts:
      - {name: return_quantity, expr: cr_return_quantity, description: Catalog return quantity., synonyms: [catalog returned units], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: return_amount, expr: cr_return_amount, description: Catalog return amount., synonyms: [catalog refund], data_type: "decimal(7,2)", using_relationships: [], non_additive_dimensions: []}
      - {name: return_amt_inc_tax, expr: cr_return_amt_inc_tax, description: Catalog return amount including tax., synonyms: [return total], data_type: "decimal(7,2)", using_relationships: [], non_additive_dimensions: []}
      - {name: net_loss, expr: cr_net_loss, description: Catalog return net loss., synonyms: [catalog return loss], data_type: "decimal(7,2)", using_relationships: [], non_additive_dimensions: []}
