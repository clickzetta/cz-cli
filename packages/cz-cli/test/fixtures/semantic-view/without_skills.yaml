name: tpcds_retail_sv
description: Reusable semantic view for TPC-DS retail analytics across store, catalog, web, returns, inventory, customers, items, dates, stores and warehouses. It targets recurring historical query patterns around channel revenue, returns, customer cohorts, product hierarchy, time windows, inventory balance and fulfillment.
tables:
  - name: store_sales
    description: Store channel sales line fact at ticket, item and customer grain.
    synonyms: [store sales, store revenue, in store purchases]
    base_table: {workspace: czcli, schema: cz_sv_tpcds_sf1_1789702136159, table: store_sales}
    primary_key: {columns: [ss_ticket_number, ss_item_sk]}
    unique_keys: []
    dimensions:
      - {name: ticket_number, expr: ss_ticket_number, description: Store sales ticket number., synonyms: [ticket], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: customer_key, expr: ss_customer_sk, description: Store sales customer surrogate key., synonyms: [store customer], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: item_key, expr: ss_item_sk, description: Sold item surrogate key., synonyms: [store item], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: store_key, expr: ss_store_sk, description: Store surrogate key., synonyms: [store], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
    time_dimensions: []
    facts:
      - {name: quantity, expr: ss_quantity, description: Store sales quantity., synonyms: [units], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: sales_price, expr: ss_sales_price, description: Store sales unit sales price., synonyms: [unit price], data_type: "decimal(7,2)", using_relationships: [], non_additive_dimensions: []}
      - {name: ext_sales_price, expr: ss_ext_sales_price, description: Extended store sales amount., synonyms: [store sales amount], data_type: "decimal(7,2)", using_relationships: [], non_additive_dimensions: []}
      - {name: ext_list_price, expr: ss_ext_list_price, description: Extended store list price before discount., synonyms: [store list amount], data_type: "decimal(7,2)", using_relationships: [], non_additive_dimensions: []}
      - {name: ext_discount_amt, expr: ss_ext_discount_amt, description: Extended discount amount for store sales., synonyms: [store discount], data_type: "decimal(7,2)", using_relationships: [], non_additive_dimensions: []}
      - {name: coupon_amt, expr: ss_coupon_amt, description: Store sales coupon amount., synonyms: [coupon], data_type: "decimal(7,2)", using_relationships: [], non_additive_dimensions: []}
      - {name: net_paid, expr: ss_net_paid, description: Store sales net paid amount., synonyms: [paid], data_type: "decimal(7,2)", using_relationships: [], non_additive_dimensions: []}
      - {name: net_profit, expr: ss_net_profit, description: Store sales net profit., synonyms: [profit], data_type: "decimal(7,2)", using_relationships: [], non_additive_dimensions: []}
      - {name: ext_tax, expr: ss_ext_tax, description: Store sales extended tax., synonyms: [tax], data_type: "decimal(7,2)", using_relationships: [], non_additive_dimensions: []}
    metrics:
      - {name: sales_rows, expr: COUNT(*), description: Count of store sales rows., synonyms: [store line count], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: store_sales_amount, expr: SUM(ss_ext_sales_price), description: Total extended store sales amount., synonyms: [store revenue], data_type: decimal, using_relationships: [], non_additive_dimensions: []}
      - {name: store_net_profit, expr: SUM(ss_net_profit), description: Total store sales net profit., synonyms: [store profit], data_type: decimal, using_relationships: [], non_additive_dimensions: []}
      - {name: store_quantity, expr: SUM(ss_quantity), description: Total store sales quantity., synonyms: [store units], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
    filters:
      - {name: positive_store_sales, expr: ss_ext_sales_price > 0, description: Store sales rows with positive extended sales price., synonyms: [positive sales], using_relationships: [], non_additive_dimensions: []}
    constraints: []
  - name: catalog_sales
    description: Catalog channel sales line fact at order, item and customer grain.
    synonyms: [catalog sales, catalog revenue]
    base_table: {workspace: czcli, schema: cz_sv_tpcds_sf1_1789702136159, table: catalog_sales}
    primary_key: {columns: [cs_order_number, cs_item_sk]}
    unique_keys: []
    dimensions:
      - {name: order_number, expr: cs_order_number, description: Catalog order number., synonyms: [catalog order], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: bill_customer_key, expr: cs_bill_customer_sk, description: Billing customer key for catalog sale., synonyms: [catalog customer], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: ship_customer_key, expr: cs_ship_customer_sk, description: Shipping customer key for catalog sale., synonyms: [catalog ship customer], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: item_key, expr: cs_item_sk, description: Catalog item surrogate key., synonyms: [catalog item], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
    time_dimensions: []
    facts:
      - {name: quantity, expr: cs_quantity, description: Catalog sales quantity., synonyms: [catalog units], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: sales_price, expr: cs_sales_price, description: Catalog sales unit price., synonyms: [catalog price], data_type: "decimal(7,2)", using_relationships: [], non_additive_dimensions: []}
      - {name: ext_sales_price, expr: cs_ext_sales_price, description: Extended catalog sales amount., synonyms: [catalog amount], data_type: "decimal(7,2)", using_relationships: [], non_additive_dimensions: []}
      - {name: coupon_amt, expr: cs_coupon_amt, description: Catalog coupon amount., synonyms: [catalog coupon], data_type: "decimal(7,2)", using_relationships: [], non_additive_dimensions: []}
      - {name: net_profit, expr: cs_net_profit, description: Catalog sales net profit., synonyms: [catalog profit], data_type: "decimal(7,2)", using_relationships: [], non_additive_dimensions: []}
      - {name: ext_ship_cost, expr: cs_ext_ship_cost, description: Catalog extended shipping cost., synonyms: [catalog shipping], data_type: "decimal(7,2)", using_relationships: [], non_additive_dimensions: []}
    metrics:
      - {name: catalog_sales_amount, expr: SUM(cs_ext_sales_price), description: Total catalog extended sales amount., synonyms: [catalog revenue], data_type: decimal, using_relationships: [], non_additive_dimensions: []}
      - {name: catalog_net_profit, expr: SUM(cs_net_profit), description: Total catalog net profit., synonyms: [catalog profit], data_type: decimal, using_relationships: [], non_additive_dimensions: []}
      - {name: catalog_quantity, expr: SUM(cs_quantity), description: Total catalog quantity., synonyms: [catalog units], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
    filters: []
    constraints: []
  - name: web_sales
    description: Web channel sales line fact at order, item, customer, website and warehouse grain.
    synonyms: [web sales, online sales, web revenue]
    base_table: {workspace: czcli, schema: cz_sv_tpcds_sf1_1789702136159, table: web_sales}
    primary_key: {columns: [ws_order_number, ws_item_sk]}
    unique_keys: []
    dimensions:
      - {name: order_number, expr: ws_order_number, description: Web order number., synonyms: [web order], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: bill_customer_key, expr: ws_bill_customer_sk, description: Billing customer key for web sale., synonyms: [web customer], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: item_key, expr: ws_item_sk, description: Web item surrogate key., synonyms: [web item], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: warehouse_key, expr: ws_warehouse_sk, description: Fulfillment warehouse key., synonyms: [web warehouse], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
    time_dimensions: []
    facts:
      - {name: quantity, expr: ws_quantity, description: Web sales quantity., synonyms: [web units], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: sales_price, expr: ws_sales_price, description: Web sales unit price., synonyms: [web price], data_type: "decimal(7,2)", using_relationships: [], non_additive_dimensions: []}
      - {name: ext_sales_price, expr: ws_ext_sales_price, description: Extended web sales amount., synonyms: [web amount], data_type: "decimal(7,2)", using_relationships: [], non_additive_dimensions: []}
      - {name: ext_ship_cost, expr: ws_ext_ship_cost, description: Web extended shipping cost., synonyms: [web shipping], data_type: "decimal(7,2)", using_relationships: [], non_additive_dimensions: []}
      - {name: net_profit, expr: ws_net_profit, description: Web sales net profit., synonyms: [web profit], data_type: "decimal(7,2)", using_relationships: [], non_additive_dimensions: []}
    metrics:
      - {name: web_sales_amount, expr: SUM(ws_ext_sales_price), description: Total web extended sales amount., synonyms: [web revenue], data_type: decimal, using_relationships: [], non_additive_dimensions: []}
      - {name: web_net_profit, expr: SUM(ws_net_profit), description: Total web net profit., synonyms: [web profit], data_type: decimal, using_relationships: [], non_additive_dimensions: []}
      - {name: web_quantity, expr: SUM(ws_quantity), description: Total web quantity., synonyms: [web units], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
    filters: []
    constraints: []
  - name: store_returns
    description: Store channel return fact keyed by ticket and item.
    synonyms: [store returns]
    base_table: {workspace: czcli, schema: cz_sv_tpcds_sf1_1789702136159, table: store_returns}
    primary_key: {columns: [sr_ticket_number, sr_item_sk]}
    unique_keys: []
