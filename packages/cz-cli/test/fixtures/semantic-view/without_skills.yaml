      - {name: web_return_amount, expr: SUM(wr_return_amt), description: Total web return amount., synonyms: [web refunds], data_type: decimal, using_relationships: [], non_additive_dimensions: []}
      - {name: web_return_quantity, expr: SUM(wr_return_quantity), description: Total web returned quantity., synonyms: [web returned units], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
    filters: []
    constraints: []
  - name: inventory
    description: Daily inventory balance by item and warehouse.
    synonyms: [inventory, stock, quantity on hand]
    base_table: {workspace: czcli, schema: cz_sv_tpcds_sf1_1789702136159, table: inventory}
    primary_key: {columns: [inv_date_sk, inv_item_sk, inv_warehouse_sk]}
    unique_keys: []
    dimensions:
      - {name: item_key, expr: inv_item_sk, description: Inventory item key., synonyms: [stock item], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: warehouse_key, expr: inv_warehouse_sk, description: Inventory warehouse key., synonyms: [stock warehouse], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
    time_dimensions: []
    facts:
      - {name: quantity_on_hand, expr: inv_quantity_on_hand, description: Inventory quantity on hand., synonyms: [qoh, stock quantity], data_type: int, using_relationships: [], non_additive_dimensions: []}
    metrics:
      - {name: avg_quantity_on_hand, expr: AVG(inv_quantity_on_hand), description: Average inventory quantity on hand., synonyms: [average qoh], data_type: double, using_relationships: [], non_additive_dimensions: []}
      - {name: total_quantity_on_hand, expr: SUM(inv_quantity_on_hand), description: Total inventory quantity on hand., synonyms: [total qoh], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: qoh_stddev, expr: STDDEV_SAMP(inv_quantity_on_hand), description: Sample standard deviation of inventory quantity on hand., synonyms: [qoh stdev], data_type: double, using_relationships: [], non_additive_dimensions: []}
    filters: []
    constraints: []
  - name: item
    description: Product and item dimension with category, class, brand, manufacturer and price attributes.
    synonyms: [product, item, merchandise]
    base_table: {workspace: czcli, schema: cz_sv_tpcds_sf1_1789702136159, table: item}
    primary_key: {columns: [i_item_sk]}
    unique_keys: [{columns: [i_item_id]}]
    dimensions:
      - {name: item_id, expr: i_item_id, description: Business item identifier., synonyms: [item code], data_type: string, unique: true, using_relationships: [], non_additive_dimensions: []}
      - {name: item_desc, expr: i_item_desc, description: Item description., synonyms: [description], data_type: string, using_relationships: [], non_additive_dimensions: []}
      - {name: category, expr: i_category, description: "Item category such as Books, Home or Sports.", synonyms: [product category], data_type: string, sample_values: [Books, Home, Sports], using_relationships: [], non_additive_dimensions: []}
      - {name: category_id, expr: i_category_id, description: Item category identifier., synonyms: [category key], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: class, expr: i_class, description: Item class within category., synonyms: [product class], data_type: string, using_relationships: [], non_additive_dimensions: []}
      - {name: class_id, expr: i_class_id, description: Item class identifier., synonyms: [class key], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: brand, expr: i_brand, description: Item brand name., synonyms: [product brand], data_type: string, using_relationships: [], non_additive_dimensions: []}
      - {name: brand_id, expr: i_brand_id, description: Item brand identifier., synonyms: [brand key], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: manufacturer_id, expr: i_manufact_id, description: Item manufacturer identifier., synonyms: [manufact id], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: product_name, expr: i_product_name, description: Product name used in inventory rollups., synonyms: [product], data_type: string, using_relationships: [], non_additive_dimensions: []}
      - {name: color, expr: i_color, description: Item color., synonyms: [product color], data_type: string, using_relationships: [], non_additive_dimensions: []}
      - {name: manager_id, expr: i_manager_id, description: Item manager identifier., synonyms: [manager], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
    time_dimensions: []
    facts:
      - {name: current_price, expr: i_current_price, description: Current item price., synonyms: [item price], data_type: "decimal(7,2)", using_relationships: [], non_additive_dimensions: []}
      - {name: wholesale_cost, expr: i_wholesale_cost, description: Item wholesale cost., synonyms: [cost], data_type: "decimal(7,2)", using_relationships: [], non_additive_dimensions: []}
    metrics:
      - {name: avg_current_price, expr: AVG(i_current_price), description: Average current item price., synonyms: [average item price], data_type: decimal, using_relationships: [], non_additive_dimensions: []}
    filters:
      - {name: tpcds_focus_categories, expr: "i_category IN ('Sports', 'Books', 'Home')", description: Product categories frequently used by historical revenue-share queries., synonyms: [sports books home], using_relationships: [], non_additive_dimensions: []}
    constraints: []
  - name: date_dim
    description: Calendar date dimension with day, week, month, quarter and year attributes.
    synonyms: [date, calendar, sold date, ship date, returned date]
    base_table: {workspace: czcli, schema: cz_sv_tpcds_sf1_1789702136159, table: date_dim}
    primary_key: {columns: [d_date_sk]}
    unique_keys: [{columns: [d_date]}]
    dimensions:
      - {name: date_id, expr: d_date_id, description: Date business identifier., synonyms: [date code], data_type: string, using_relationships: [], non_additive_dimensions: []}
      - {name: year, expr: d_year, description: Calendar year., synonyms: [calendar year], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: month_seq, expr: d_month_seq, description: Sequential month number., synonyms: [month sequence], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: week_seq, expr: d_week_seq, description: Sequential week number., synonyms: [week sequence], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: month_of_year, expr: d_moy, description: Month number within year., synonyms: [month], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: quarter_of_year, expr: d_qoy, description: Quarter number within year., synonyms: [quarter], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: quarter_name, expr: d_quarter_name, description: Quarter label such as 2001Q1., synonyms: [quarter label], data_type: string, using_relationships: [], non_additive_dimensions: []}
      - {name: day_of_month, expr: d_dom, description: Day of month., synonyms: [dom], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: day_of_week, expr: d_dow, description: Day of week number., synonyms: [dow], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
      - {name: day_name, expr: d_day_name, description: Day of week name., synonyms: [weekday], data_type: string, sample_values: [Sunday, Monday, Tuesday], using_relationships: [], non_additive_dimensions: []}
    time_dimensions:
      - {name: date, expr: d_date, description: Calendar date., synonyms: [calendar date], data_type: date, is_time: true, using_relationships: [], non_additive_dimensions: []}
    facts: []
    metrics: []
    filters:
      - {name: month_seq_1200_year, expr: d_month_seq BETWEEN 1200 AND 1211, description: Common 12-month analysis window from historical queries., synonyms: [month sequence 1200], using_relationships: [], non_additive_dimensions: []}
    constraints: []
  - name: customer
    description: Customer dimension with name, contact and current demographic/address keys.
    synonyms: [customer, shopper]
    base_table: {workspace: czcli, schema: cz_sv_tpcds_sf1_1789702136159, table: customer}
    primary_key: {columns: [c_customer_sk]}
    unique_keys: [{columns: [c_customer_id]}]
    dimensions:
      - {name: customer_id, expr: c_customer_id, description: Customer business identifier., synonyms: [customer code], data_type: string, unique: true, using_relationships: [], non_additive_dimensions: []}
      - {name: first_name, expr: c_first_name, description: Customer first name., synonyms: [given name], data_type: string, using_relationships: [], non_additive_dimensions: []}
      - {name: last_name, expr: c_last_name, description: Customer last name., synonyms: [surname], data_type: string, using_relationships: [], non_additive_dimensions: []}
      - {name: salutation, expr: c_salutation, description: Customer salutation., synonyms: [title], data_type: string, using_relationships: [], non_additive_dimensions: []}
      - {name: preferred_flag, expr: c_preferred_cust_flag, description: Preferred customer flag., synonyms: [preferred customer], data_type: string, using_relationships: [], non_additive_dimensions: []}
      - {name: birth_country, expr: c_birth_country, description: Customer birth country., synonyms: [country of birth], data_type: string, using_relationships: [], non_additive_dimensions: []}
      - {name: email_address, expr: c_email_address, description: Customer email address., synonyms: [email], data_type: string, using_relationships: [], non_additive_dimensions: []}
    time_dimensions: []
    facts: []
    metrics:
      - {name: customer_count, expr: COUNT(DISTINCT c_customer_sk), description: Distinct customer count., synonyms: [customers], data_type: bigint, using_relationships: [], non_additive_dimensions: []}
    filters: []
    constraints: []
  - name: customer_address
