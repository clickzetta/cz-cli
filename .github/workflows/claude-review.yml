name: Codex Code Review

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: PR number to verify/review
        required: true
        type: string
      dry_run:
        description: Validate without publishing a review
        default: true
        type: boolean
      candidate_model:
        description: Model override for a dry run
        required: false
        type: string
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read

jobs:
  review:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.draft == false && (github.event.action != 'edited' || github.event.changes.base))
    concurrency:
      group: codex-review-${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run && format('dry-run-{0}', github.run_id)) || github.event.pull_request.number || inputs.pull_request }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
    steps:
      # Execute the trusted base runner, never scripts from the proposed head.
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup-bun-runtime
      - name: Resolve PR identity and classify full diff
        id: identity
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha }}
          EXPECTED_BASE: ${{ github.event.pull_request.base.sha }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
        run: |
          bun -e '
            import { hasReviewablePaths } from "./.github/scripts/ai-review.ts";
            const number = process.env.REVIEW_NUMBER;
            if (!/^[1-9]\d*$/.test(number)) throw new Error("Invalid PR number");
            const child = Bun.spawn(["gh", "api", `repos/${process.env.GITHUB_REPOSITORY}/pulls/${number}`]);
            const pr = await new Response(child.stdout).json();
            if (await child.exited !== 0 || pr.head.repo?.full_name !== process.env.GITHUB_REPOSITORY || pr.draft ||
                (process.env.DRY_RUN !== "true" && pr.state !== "open") ||
                (process.env.EXPECTED_HEAD && pr.head.sha !== process.env.EXPECTED_HEAD) ||
                (process.env.EXPECTED_BASE && pr.base.sha !== process.env.EXPECTED_BASE)) throw new Error("PR identity changed or is ineligible");
            const fetchProc = Bun.spawn(["git", "fetch", "--no-tags", "origin", pr.head.sha, pr.base.sha]);
            if (await fetchProc.exited !== 0) throw new Error("Failed to fetch immutable PR commits");
            const diffProc = Bun.spawn(["git", "diff", "--no-color", "--no-ext-diff", "--find-renames", "--src-prefix=a/", "--dst-prefix=b/", "--unified=0", `${pr.base.sha}...${pr.head.sha}`]);
            const diff = await new Response(diffProc.stdout).text();
            if (await diffProc.exited !== 0) throw new Error("Failed to compute full PR diff");
            const skipDocsOnly = process.env.DRY_RUN !== "true" && !hasReviewablePaths(diff);
            const file = Bun.file(process.env.GITHUB_OUTPUT);
            await Bun.write(file, await file.text() + `head=${pr.head.sha}\nbase=${pr.base.sha}\nskip_docs_only=${skipDocsOnly}\n`);
          '
      - name: Install pinned Codex CLI
        if: steps.identity.outputs.skip_docs_only != 'true'
        run: npm install --global @openai/codex@0.167.1
      # Match Codex Action's default privilege reduction on an ephemeral runner.
      - name: Remove passwordless privilege escalation
        if: steps.identity.outputs.skip_docs_only != 'true'
        run: sudo rm -f /etc/sudoers.d/runner /usr/bin/sudo /bin/sudo
      - name: Review immutable head and publish validated inline findings
        if: steps.identity.outputs.skip_docs_only != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_PR_NUMBER: ${{ github.event.pull_request.number || inputs.pull_request }}
          REVIEW_HEAD_SHA: ${{ steps.identity.outputs.head }}
          REVIEW_BASE_SHA: ${{ steps.identity.outputs.base }}
          CODEX_REVIEW_API_KEY: ${{ secrets.CODEX_REVIEW_API_KEY }}
          CODEX_REVIEW_BASE_URL: ${{ secrets.CODEX_REVIEW_BASE_URL }}
          CODEX_REVIEW_DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          CODEX_REVIEW_MODEL: ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run && inputs.candidate_model) || vars.CODEX_REVIEW_MODEL }}
        run: |
          export CODEX_BINARY="$(command -v codex)"
          bun .github/scripts/ai-review.ts
      - name: Remove private model state
        if: always()
        run: rm -rf "$RUNNER_TEMP/cz-ai-review"
