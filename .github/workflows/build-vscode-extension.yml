name: build-vscode-extension

# Builds the cz-cli VS Code extension into a .vsix and attaches it as a workflow
# artifact so internal users can download and sideload it. Deliberately does NOT
# publish to the VS Code Marketplace or Open VSX — there is no publisher account,
# and none is needed for artifact/Release distribution. See
# sdks/cz-vscode/README.md "Install".
#
# Separate from test.yml on purpose: sdks/cz-vscode is NOT a workspace member of
# the root package.json, it carries its own bun.lock, and it must not pull in the
# monorepo's install. Runs only when the extension (or this workflow) changes, so
# it costs nothing on unrelated commits.

on:
  push:
    branches:
      - main
      - dev
      - "cz-*"
    paths:
      - "sdks/cz-vscode/**"
      - ".github/workflows/build-vscode-extension.yml"
  pull_request:
    paths:
      - "sdks/cz-vscode/**"
      - ".github/workflows/build-vscode-extension.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sdks/cz-vscode
    steps:
      - name: Checkout repository
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"

      # `defaults.run.working-directory` applies to `run` steps ONLY, so this action
      # resolves paths against the repo root — bun-version-file therefore reads the
      # ROOT package.json (packageManager: bun@x.y.z), which is what we want: one
      # pinned bun version for the whole repo. sdks/cz-vscode/package.json has no
      # packageManager field, so pointing this at the subdirectory would break.
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Same approach as publish-vscode.yml: vsce comes from a global install and is
      # invoked by script/package off PATH.
      - name: Install vsce
        run: bun install -g @vscode/vsce

      # Version the artifact off the commit so a downloaded vsix is traceable to a
      # build, and so reinstalling a newer build actually replaces the old one
      # (VS Code compares versions; identical versions can be treated as no-ops).
      # Non-tag builds get 0.1.0-dev.<run>.<sha> — semver prerelease, so it sorts
      # below a future real 0.1.0 release.
      - name: Resolve version
        id: version
        run: |
          BASE=$(node -p "require('./package.json').version")
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="$BASE"
          else
            VERSION="${BASE}-dev.${{ github.run_number }}.$(echo "${{ github.sha }}" | cut -c1-7)"
          fi
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Building version: $VERSION"

      - name: Package extension
        run: ./script/package "${{ steps.version.outputs.value }}"

      - name: Upload vsix
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: vscode-extension
          path: sdks/cz-vscode/dist/*.vsix
          if-no-files-found: error
          retention-days: 30
